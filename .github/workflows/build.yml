name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      # Numéro de version qui augmente à chaque build
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle && grep -n versionCode android/app/build.gradle
      # Signature fixe : on impose debug.keystore (à la racine du dépôt) dans le build Android
      - name: Signature fixe
        run: |
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android | grep -i fingerprint
          cat >> android/app/build.gradle <<'EOF2'

          android {
              signingConfigs {
                  debug {
                      storeFile file("${{ github.workspace }}/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF2
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      # Le build échoue si l'APK n'est pas signé avec la clé du dépôt
      - name: Vérifier la clé de l'APK
        run: |
          A=$(keytool -list -keystore debug.keystore -storepass android | grep SHA-256 | sed 's/.*: //')
          B=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | sed 's/.*: //')
          echo "Clé du dépôt : $A"
          echo "Clé de l'APK : $B"
          [ "$A" = "$B" ]
      - uses: actions/upload-artifact@v4
        with:
          name: muscu15-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
