name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      # Signature fixe : même clé à chaque build, sinon Android refuse la mise à jour
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      # Numéro de version qui augmente à chaque build
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle && grep -n versionCode android/app/build.gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: muscu15-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
